name: Validate showcase
on:
  push:
    paths:
      - 'index.html'
      - 'project-metadata.js'
      - 'scripts/validate-showcase.cjs'
      - '.github/workflows/validate-showcase.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate metadata and page scripts
        run: node scripts/validate-showcase.cjs
